name: framesearch
services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-framesearch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-framesearch}
      POSTGRES_DB: ${POSTGRES_DB:-framesearch}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-framesearch}
      PGPASSWORD: ${POSTGRES_PASSWORD:-framesearch}
      PGDATABASE: ${POSTGRES_DB:-framesearch}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../db/migrations:/migrations:ro
      - ./migrate.sh:/migrate.sh:ro
    entrypoint: ["/bin/sh", "/migrate.sh"]
    restart: "no"
  kafka:
    image: apache/kafka:3.9.0
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped
  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_TOPIC: ${KAFKA_TOPIC:-media.uploaded}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$$KAFKA_TOPIC" --partitions 1 --replication-factor 1
    restart: "no"
  minio:
    image: framesearch-minio:source-2025-10-15
    build:
      context: ./minio
      target: minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-framesearch}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-framesearch-local-secret}
      MINIO_API_CORS_ALLOW_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  minio-init:
    image: framesearch-mc:source-2025-04-16
    build:
      context: ./minio
      target: mc
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-framesearch}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-framesearch-local-secret}
      S3_BUCKET: ${S3_BUCKET:-framesearch}
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./minio-init.sh:/minio-init.sh:ro
    entrypoint: ["/bin/sh", "/minio-init.sh"]
    restart: "no"
  api:
    build:
      context: ../services/api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-framesearch}:${POSTGRES_PASSWORD:-framesearch}@postgres:5432/${POSTGRES_DB:-framesearch}?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-media.uploaded}
      S3_ENDPOINT_INTERNAL: http://minio:9000
      S3_ENDPOINT_PUBLIC: ${S3_ENDPOINT_PUBLIC:-http://localhost:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-framesearch}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-framesearch-local-secret}
      S3_BUCKET: ${S3_BUCKET:-framesearch}
      PROCESSOR_URL: http://processor:8000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      MODEL_NAME: ${MODEL_NAME:-ViT-B-32}
      MODEL_PRETRAINED: ${MODEL_PRETRAINED:-laion2b_s34b_b79k}
      RECONCILE_STALE_AFTER: ${RECONCILE_STALE_AFTER:-15m}
      API_ADDR: :8080
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 120s
    restart: unless-stopped
  processor:
    profiles: [app]
    build:
      context: ../services/processor
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-framesearch}:${POSTGRES_PASSWORD:-framesearch}@postgres:5432/${POSTGRES_DB:-framesearch}?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-media.uploaded}
      S3_ENDPOINT_INTERNAL: http://minio:9000
      S3_ENDPOINT_PUBLIC: ${S3_ENDPOINT_PUBLIC:-http://localhost:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-framesearch}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-framesearch-local-secret}
      S3_BUCKET: ${S3_BUCKET:-framesearch}
      MODEL_NAME: ${MODEL_NAME:-ViT-B-32}
      MODEL_PRETRAINED: ${MODEL_PRETRAINED:-laion2b_s34b_b79k}
      HF_HOME: /model-cache/huggingface
      TORCH_HOME: /model-cache/torch
      XDG_CACHE_HOME: /model-cache
      OMP_NUM_THREADS: "2"
    volumes:
      - model-cache:/model-cache
    expose: ["8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=4)"]
      interval: 10s
      timeout: 6s
      retries: 60
      start_period: 120s
    restart: unless-stopped
  web:
    profiles: [app]
    build:
      context: ../apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
      processor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 20
    restart: unless-stopped
  api-tests:
    profiles: [tests]
    image: golang:1.24.7-alpine
    working_dir: /workspace/services/api
    command: ["go", "test", "-count=1", "./..."]
    environment:
      TEST_DATABASE_URL: postgres://${POSTGRES_USER:-framesearch}:${POSTGRES_PASSWORD:-framesearch}@postgres:5432/${POSTGRES_DB:-framesearch}?sslmode=disable
      TEST_KAFKA_BROKERS: kafka:29092
      TEST_KAFKA_TOPIC: ${KAFKA_TOPIC:-media.uploaded}.api-tests
      TEST_S3_ENDPOINT: http://minio:9000
      TEST_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-framesearch}
      TEST_S3_SECRET_KEY: ${S3_SECRET_KEY:-framesearch-local-secret}
    volumes:
      - ../:/workspace:ro
      - go-modules:/go/pkg/mod
      - go-test-cache:/root/.cache/go-build
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-test-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
  kafka-test-init:
    profiles: [tests]
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_TEST_TOPIC: ${KAFKA_TOPIC:-media.uploaded}.api-tests
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$$KAFKA_TEST_TOPIC" --partitions 1 --replication-factor 1
    restart: "no"
volumes:
  postgres-data:
  kafka-data:
  minio-data:
  model-cache:
  go-modules:
  go-test-cache:
