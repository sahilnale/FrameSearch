name: framesearch
services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-framesearch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-framesearch}
      POSTGRES_DB: ${POSTGRES_DB:-framesearch}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-framesearch}
      PGPASSWORD: ${POSTGRES_PASSWORD:-framesearch}
      PGDATABASE: ${POSTGRES_DB:-framesearch}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../db/migrations:/migrations:ro
      - ./migrate.sh:/migrate.sh:ro
    entrypoint: ["/bin/sh", "/migrate.sh"]
    restart: "no"
volumes:
  postgres-data:
